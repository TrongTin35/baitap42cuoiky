<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Chính Cá Nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Chèn ảnh logo đã nén từ thư mục images -->
        <div style="text-align: center; margin-bottom: 10px;">
            <img src="images/logo.jpg" alt="Logo" width="60">
        </div>
        
        <h1>Ứng Dụng Quản Lý Tài Chính</h1>
        
        <!-- Bổ sung link bài tập cũ -->
        <div class="previous-links">
    <p><strong>Các bài tập trước:</strong> 
        <a href="bai40.html">Bài 40</a> | 
        <a href="bai41.html">Bài 41</a> | 
        <a href="bai42.jpg" target="_blank">Bài 42</a>
    </p>
</div>
        <!-- Tổng quan tài chính -->
        <div class="summary-cards">
            <div class="card income">
                <h3>Tổng Thu</h3>
                <p id="total-income">0 ₫</p>
            </div>
            <div class="card expense">
                <h3>Tổng Chi</h3>
                <p id="total-expense">0 ₫</p>
            </div>
            <div class="card balance">
                <h3>Số Dư</h3>
                <p id="total-balance">0 ₫</p>
            </div>
        </div>

        <!-- Biểu đồ Progress Bar CSS -->
        <div class="progress-section">
            <h3>Tỷ lệ Thu / Chi</h3>
            <div class="progress-bar">
                <div id="income-bar" class="income-bar" style="width: 50%;">Thu</div>
                <div id="expense-bar" class="expense-bar" style="width: 50%;">Chi</div>
            </div>
        </div>

        <!-- Form thêm giao dịch -->
        <div class="form-container">
            <h3>Thêm Giao Dịch Mới</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="type">Loại giao dịch</label>
                    <select id="type" required>
                        <option value="income">Khoản thu</option>
                        <option value="expense">Khoản chi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Số tiền</label>
                    <input type="number" id="amount" placeholder="Nhập số tiền..." min="1" required>
                </div>
                <div class="form-group">
                    <label for="category">Danh mục</label>
                    <input type="text" id="category" placeholder="Ví dụ: Lương, Ăn uống..." required>
                </div>
                <div class="form-group">
                    <label for="date">Ngày tháng</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit">Thêm giao dịch</button>
            </form>
        </div>

        <!-- Lịch sử giao dịch -->
        <div class="history-container">
            <h3>Lịch Sử Giao Dịch</h3>
            <table id="transaction-table">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Danh mục</th>
                        <th>Loại</th>
                        <th>Số tiền</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- Dữ liệu render từ JS -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
